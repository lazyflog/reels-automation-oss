server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Docker 내장 DNS — upstream IP 재조회 주기 설정
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Next.js 대시보드 (WebSocket 지원 포함)
    location / {
        set $upstream_dashboard http://dashboard:3000;
        proxy_pass $upstream_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # FastAPI 백엔드 API
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 헬스체크
    location /health {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api/health;
        proxy_set_header Host $host;
    }

    # 영상 파일 정적 서빙 (Instagram PUBLIC_BASE_URL 용)
    # 주의: proxy_pass에 변수($upstream_api)를 쓸 때 URI(/output/)를 붙이면
    # nginx가 원본 파일명을 안 붙여 /output/만 전달 → 404. 변수만 두어 원본 URI를 그대로 전달.
    location /output/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 임시 파일 서빙 (프레임 썸네일 등)
    location /temp/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
