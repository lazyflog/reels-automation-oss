server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Docker embedded DNS — sets how often upstream IPs are re-resolved
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Next.js dashboard (with WebSocket support)
    location / {
        set $upstream_dashboard http://dashboard:3000;
        proxy_pass $upstream_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # FastAPI backend API
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api/health;
        proxy_set_header Host $host;
    }

    # Static serving of video files (for Instagram PUBLIC_BASE_URL)
    # Note: when proxy_pass uses a variable ($upstream_api), appending a URI (/output/)
    # makes nginx forward only /output/ without the file name → 404. Use the bare variable so the original URI is passed through.
    location /output/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Temporary file serving (frame thumbnails, etc.)
    location /temp/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
